# Intel QuickSync profile. See conform.local.yaml for a software-encoder
# version that runs anywhere.

libraries:
  - name: movies
    path: /data/Movies
    profile: standard
  - name: tv
    path: /data/TV
    profile: standard
    exclude:
      - "*/Season 00/*"
    # Act on files as they appear. Leave off for an NFS or SMB mount, which
    # delivers no events for writes made elsewhere — the webhook covers those.
    # watch: true

profiles:
  standard:
    container: mkv

    video:
      # Codecs accepted as they are. Anything else is re-encoded; a file
      # already in this list is never touched, which is what stops a second
      # pass re-encoding the output of the first.
      codecs: [hevc]
      maxHeight: 1080
      # scale_qsv rather than scale: with -hwaccel qsv the frames live in GPU
      # memory, and the software filter would force a download and re-upload
      # around every scale.
      scaleFilter: "scale_qsv=h={height}:w=-1"
      encoder:
        name: hevc_qsv
        inputArgs: ["-hwaccel", "qsv", "-hwaccel_output_format", "qsv"]
        options:
          global_quality: "24"
          preset: "medium"

    audio:
      languages: [eng, und]
      codecs: [aac, ac3, eac3]
      maxChannels: 6
      # The order the kept streams are acceptable in — a predicate like every
      # other rule, so a file already like this is left alone and anything else
      # is remuxed into it. `language` is a stream's position in the list
      # above, `channels` puts the widest track first. Ties keep the file's own
      # order.
      order: [language, channels]
      encoder:
        name: eac3
        options:
          b: "640k"
      # Requires a stereo track alongside every surround one in the same
      # language, deriving it where it is missing. Also a predicate: a file
      # that already has both is left alone.
      #
      # The point is the downmix. A player's own 5.1-to-stereo fold-down puts
      # the centre channel — where dialogue sits — well below the music and
      # effects around it; the default filter lifts it back above them. Set
      # `filter` to override it.
      stereoCompanion:
        encoder:
          name: aac
          options:
            b: "192k"

    # Only read by `conform orchestrate`. The PodTemplate carries everything
    # about placement — the device resource, the node selector, the mounts that
    # make the library visible — and conform copies it without interpreting any
    # of it, so a profile can require hardware conform knows nothing about.
    job:
      podTemplate: conform-qsv
      # The container whose args the file path is appended to. It must already
      # declare the subcommand and flags: conform only adds the path.
      container: conform

    subtitles:
      # Anything outside this list is dropped. An untagged stream reads as
      # "und", so listing it is what keeps untagged subtitles.
      languages: [eng, und]
      # Image-based PGS is kept, not converted — see the planner. Anything
      # outside this list is dropped rather than guessed at.
      codecs: [subrip, ass, hdmv_pgs_subtitle]
      order: [language]

execution:
  # Needs room for one source-sized file per worker. Avoid replicated storage:
  # a transcode writes a full working copy of everything it processes, and a
  # replicated volume multiplies that write by its replica count.
  tempDir: /temp
  stateDir: /config
  workers: 1
  # chown replaced files. Needed where other applications share the library and
  # expect a fixed uid/gid — a rewritten file otherwise lands owned by conform.
  owner:
    uid: 3000
    gid: 3000

# Only read by `conform orchestrate`.
orchestrator:
  namespace: media
  # Jobs in flight. Without a cap, one pass over a large library creates an API
  # object per non-conformant file, all at once; the rest are picked up by the
  # next pass, which re-derives them from the library anyway.
  maxActive: 4
  ttlSecondsAfterFinished: 3600
  # Retries are for infrastructure faults. A file that cannot be encoded exits
  # 0 and is owned by the excuse ledger, so the two never multiply.
  backoffLimit: 2

# Other services post new files here, and conform acts on them at once:
# POST /webhook with {"paths": [...]}, or point Sonarr and Radarr's Connect →
# Webhook at /webhook/sonarr and /webhook/radarr. rewrite maps a prefix as a
# service sees the library onto where conform sees it.
# webhook:
#   listen: ":8080"
#   rewrite:
#     - from: /tv
#       to: /data/TV
